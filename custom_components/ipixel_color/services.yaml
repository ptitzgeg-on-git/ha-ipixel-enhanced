display_text:
  name: Display Text
  description: Display text on the iPIXEL device with custom effects and colors
  target:
    entity:
      integration: ipixel_color
      domain: text
  fields:
    text:
      name: Text
      description: Text to display (max 500 characters)
      required: true
      example: "Hello World"
      selector:
        text:
    effect:
      name: Effect
      description: Display effect for the text
      required: false
      default: "scroll_ltr"
      selector:
        select:
          options:
            - "fixed"
            - "scroll_rtl"
            - "scroll_ltr"
            - "blink"
            - "breeze"
            - "snow"
            - "laser"
    speed:
      name: Speed
      description: Animation speed (1-100)
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    color_fg:
      name: Text Color
      description: Foreground text color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    color_bg:
      name: Background Color
      description: Background color
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:

show_page:
  name: Show page
  description: >-
    Render a widget page and push it to the display. Provide either a saved
    page "name" (created in the iPIXEL card) or an inline "page" definition.
  target:
    device:
      integration: ipixel_color
  fields:
    name:
      name: Saved page name
      description: Name of a page saved from the iPIXEL card
      required: false
      example: weather
      selector:
        text:
    page:
      name: Inline page
      description: >-
        Page definition with a background and a list of widgets. See WIDGETS.md.
      required: false
      example: >-
        {"background": "000000", "widgets": [{"type": "text", "text": "Hi",
        "anchor": "center", "color": "ffaa00"}]}
      selector:
        object:
    save_slot:
      name: Save to slot
      description: 1-255 also stores the page in device memory (recall with Show slot). 0 = don't save.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

set_orientation:
  name: Set orientation
  description: Rotate the display (hardware orientation, affects all modes).
  target:
    device:
      integration: ipixel_color
  fields:
    orientation:
      name: Orientation
      description: 0=0°, 1=90°, 2=180°, 3=270°
      required: true
      selector:
        number:
          min: 0
          max: 3
          mode: slider

set_fun_mode:
  name: Set fun mode
  description: Toggle the panel's built-in 'fun' effect mode.
  target:
    device:
      integration: ipixel_color
  fields:
    enable:
      name: Enable
      required: true
      selector:
        boolean:

show_image:
  name: Show image / GIF
  description: >-
    Send an image or animated GIF to the panel. Animated GIFs play natively.
    Source can be an http(s) URL or a local path (/local/... = your config/www).
  target:
    device:
      integration: ipixel_color
  fields:
    source:
      name: Source
      description: URL or local path to a PNG/JPG/GIF
      required: true
      example: /local/cat.gif
      selector:
        text:
    save_slot:
      name: Save to slot
      description: 1-255 stores it in device memory. 0 = don't save.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

show_slot:
  name: Show slot
  description: Recall a program stored in the device's memory (no Home Assistant needed afterwards).
  target:
    device:
      integration: ipixel_color
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box

delete_slot:
  name: Delete slot
  description: Delete a stored program slot on the device.
  target:
    device:
      integration: ipixel_color
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
set_rhythm_animation:
  name: Rhythm animation
  description: Play a self-contained rhythm/visualizer animation on the panel (no audio feed needed).
  target:
    device:
      integration: ipixel_color
  fields:
    style:
      name: Style
      description: 0 or 1
      required: false
      default: 0
      selector:
        number: { min: 0, max: 1, mode: slider }
    frame:
      name: Frame / speed
      description: 0-7
      required: false
      default: 0
      selector:
        number: { min: 0, max: 7, mode: slider }

set_rhythm_levels:
  name: Rhythm levels (audio bars)
  description: >-
    Draw audio-reactive bars from levels you supply (e.g. from an audio analysis
    sensor). Send repeatedly to animate. 11 levels, each 0-15.
  target:
    device:
      integration: ipixel_color
  fields:
    style:
      name: Style
      description: 0-4
      required: false
      default: 0
      selector:
        number: { min: 0, max: 4, mode: slider }
    levels:
      name: Levels
      description: List of up to 11 integers 0-15
      required: true
      example: "[3, 7, 12, 9, 5, 2, 8, 14, 6, 4, 1]"
      selector:
        object:

set_playlist:
  name: Enable/disable playlist
  description: Start or stop the auto-rotating page playlist (configured in the iPIXEL card).
  fields:
    enable:
      name: Enable
      required: true
      selector:
        boolean:
    device_id:
      name: Target device
      description: Optional — which display the playlist should play on.
      required: false
      selector:
        device:
          integration: ipixel_color

set_program:
  name: Native animation (cycle slots)
  description: >-
    Tell the panel to auto-cycle stored slots by itself (the box's "animation"
    feature). Save pages/images to slots first with save_slot, then list them
    here. Runs on the device with no Home Assistant or Bluetooth needed.
  target:
    device:
      integration: ipixel_color
  fields:
    slots:
      name: Slots
      description: List of slot numbers to rotate, e.g. [1, 2, 3]
      required: true
      example: "[1, 2, 3]"
      selector:
        object:

set_pixel:
  name: Draw pixel (DIY mode)
  description: >-
    Light a single pixel. Enable "DIY Draw Mode" first (the screen goes blank,
    then you draw). color is a hex string like ff0000.
  target:
    device:
      integration: ipixel_color
  fields:
    x:
      name: X
      required: true
      selector: { number: { min: 0, max: 63, mode: box } }
    y:
      name: Y
      required: true
      selector: { number: { min: 0, max: 63, mode: box } }
    color:
      name: Color (hex)
      required: false
      default: ffffff
      example: ff0000
      selector: { text: }
