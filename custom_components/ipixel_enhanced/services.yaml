show_text:
  name: Show text
  description: Scroll or display text on the panel using the device's built-in text engine (ticks on the panel, no Bluetooth traffic once sent).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    text:
      name: Text
      description: Text to display (templates are supported, max 500 characters)
      required: true
      example: "Hello {{ states('sensor.outdoor_temperature') }}°"
      selector:
        text:
    color:
      name: Text color (hex)
      description: Foreground colour as a hex string, e.g. ffaa00.
      required: false
      default: "ffffff"
      example: "ffaa00"
      selector:
        text:
    bg_color:
      name: Background color (hex)
      description: Background colour as a hex string. 000000 = transparent/off.
      required: false
      default: "000000"
      example: "000000"
      selector:
        text:
    animation:
      name: Animation
      description: 0=fixed, 1=scroll left, 2=scroll right, 3=scroll up, 4=scroll down, 5=blink, 6=breeze, 7=snow (0-7; 3 & 4 are ignored on non-32x32 panels).
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 7
          mode: box
    speed:
      name: Speed
      description: Animation speed (0-100).
      required: false
      default: 60
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    rainbow:
      name: Rainbow
      description: Rainbow colour cycling mode (0=off, 1-9 styles).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box

show_emoji:
  name: Show emoji
  description: Render a colour emoji full-screen on the panel (Twemoji).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    emoji:
      name: Emoji
      description: A single emoji to display.
      required: true
      example: "🔔"
      selector:
        text:
    bg_color:
      name: Background color
      description: Background colour behind the emoji.
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:

show_clock:
  name: Show clock
  description: >-
    Switch the panel to its native clock mode. The clock then ticks on the
    device itself with no Bluetooth traffic — use this from automations (setting
    the Clock entities alone does not refresh the display).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    style:
      name: Style
      description: Clock face style (0-8).
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 8
          mode: slider
    format_24:
      name: 24-hour format
      description: Use 24-hour time (off = 12-hour).
      required: false
      default: true
      selector:
        boolean:
    show_date:
      name: Show date
      description: Show the date alongside the time.
      required: false
      default: true
      selector:
        boolean:

show_page:
  name: Show page
  description: >-
    Render a widget page and push it to the display. Provide either a saved
    page "name" (created in the iPIXEL card) or an inline "page" definition.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    name:
      name: Saved page name
      description: Name of a page saved from the iPIXEL card
      required: false
      example: weather
      selector:
        text:
    page:
      name: Inline page
      description: >-
        Page definition with a background and a list of widgets. See WIDGETS.md.
      required: false
      example: >-
        {"background": "000000", "widgets": [{"type": "text", "text": "Hi",
        "anchor": "center", "color": "ffaa00"}]}
      selector:
        object:
    save_slot:
      name: Save to slot
      description: 1-255 also stores the page in device memory (recall with Show slot). 0 = don't save.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

set_orientation:
  name: Set orientation
  description: Rotate the display (hardware orientation, affects all modes).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    orientation:
      name: Orientation
      description: 0=0°, 1=90°, 2=180°, 3=270°
      required: true
      selector:
        number:
          min: 0
          max: 3
          mode: slider

set_fun_mode:
  name: Set fun mode
  description: Toggle the panel's built-in 'fun' effect mode.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    enable:
      name: Enable
      required: true
      selector:
        boolean:

show_image:
  name: Show image / GIF
  description: >-
    Send an image or animated GIF to the panel. Animated GIFs play natively.
    Source can be an http(s) URL or a local path (/local/... = your config/www).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    source:
      name: Source
      description: URL or local path to a PNG/JPG/GIF
      required: true
      example: /local/cat.gif
      selector:
        text:
    save_slot:
      name: Save to slot
      description: 1-255 stores it in device memory. 0 = don't save.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

show_slot:
  name: Show slot
  description: Recall a program stored in the device's memory (no Home Assistant needed afterwards).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box

delete_slot:
  name: Delete slot
  description: Delete a stored program slot on the device.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
set_rhythm_animation:
  name: Rhythm animation
  description: Play a self-contained rhythm/visualizer animation on the panel (no audio feed needed).
  target:
    device:
      integration: ipixel_enhanced
  fields:
    style:
      name: Style
      description: 0 or 1
      required: false
      default: 0
      selector:
        number: { min: 0, max: 1, mode: slider }
    frame:
      name: Frame / speed
      description: 0-7
      required: false
      default: 0
      selector:
        number: { min: 0, max: 7, mode: slider }

set_rhythm_levels:
  name: Rhythm levels (audio bars)
  description: >-
    Draw audio-reactive bars from levels you supply (e.g. from an audio analysis
    sensor). Send repeatedly to animate. 11 levels, each 0-15.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    style:
      name: Style
      description: 0-4
      required: false
      default: 0
      selector:
        number: { min: 0, max: 4, mode: slider }
    levels:
      name: Levels
      description: List of up to 11 integers 0-15
      required: true
      example: "[3, 7, 12, 9, 5, 2, 8, 14, 6, 4, 1]"
      selector:
        object:

set_playlist:
  name: Stop playlist (legacy)
  description: >-
    Stop the auto-rotating playlist. Kept for backwards compatibility — to start
    a playlist use start_playlist with a name. Only enable=false does anything.
  fields:
    enable:
      name: Enable
      required: true
      selector:
        boolean:
    device_id:
      name: Target panels
      description: Optional — which panels to stop (defaults to all).
      required: false
      selector:
        device:
          integration: ipixel_enhanced
          multiple: true

start_playlist:
  name: Start a named playlist
  description: >-
    Start one of the named playlists created in the iPIXEL card. Each chosen
    panel auto-rotates that playlist's pages independently until you stop it or
    start another on that panel.
  fields:
    name:
      name: Playlist name
      description: The playlist name as saved in the iPIXEL card.
      required: true
      selector:
        text:
    device_id:
      name: Target panels
      description: >-
        Optional — which panels to play it on. You can pick several. Defaults to
        the playlist's saved targets, or all panels if none were saved.
      required: false
      selector:
        device:
          integration: ipixel_enhanced
          multiple: true

stop_playlist:
  name: Stop the playlist
  description: Stop the running playlist on the given panels (or all panels).
  fields:
    device_id:
      name: Target panels
      description: Optional — which panels to stop (defaults to all).
      required: false
      selector:
        device:
          integration: ipixel_enhanced
          multiple: true

set_program:
  name: Native animation (cycle slots)
  description: >-
    Tell the panel to auto-cycle stored slots by itself (the box's "animation"
    feature). Save pages/images to slots first with save_slot, then list them
    here. Runs on the device with no Home Assistant or Bluetooth needed.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    slots:
      name: Slots
      description: List of slot numbers to rotate, e.g. [1, 2, 3]
      required: true
      example: "[1, 2, 3]"
      selector:
        object:

set_pixel:
  name: Draw pixel (DIY mode)
  description: >-
    Light a single pixel. Enable "DIY Draw Mode" first (the screen goes blank,
    then you draw). color is a hex string like ff0000.
  target:
    device:
      integration: ipixel_enhanced
  fields:
    x:
      name: X
      required: true
      selector: { number: { min: 0, max: 63, mode: box } }
    y:
      name: Y
      required: true
      selector: { number: { min: 0, max: 63, mode: box } }
    color:
      name: Color (hex)
      required: false
      default: ffffff
      example: ff0000
      selector: { text: }
